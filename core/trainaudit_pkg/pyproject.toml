[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trainaudit"
version = "0.1.0-phase1"
description = "Tiered trace + invariant checking for distributed training silent error detection"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "duckdb>=0.10",
]

[tool.setuptools.packages.find]
include = ["trainaudit*"]
